# ros2_control Controller Manager Configuration
controller_manager:
  ros__parameters:
    update_rate: 100 # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

# Arm Joint Trajectory Controller Configuration
arm_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    open_loop_control: true
    allow_integration_in_goal_trajectories: true
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0
      joint1: { trajectory: 0.05, goal: 0.02 }
      joint2: { trajectory: 0.05, goal: 0.02 }
      joint3: { trajectory: 0.05, goal: 0.02 }
      joint4: { trajectory: 0.05, goal: 0.02 }
      joint5: { trajectory: 0.05, goal: 0.02 }
      joint6: { trajectory: 0.05, goal: 0.02 }

# Gripper Joint Trajectory Controller Configuration
gripper_controller:
  ros__parameters:
    joints:
      - gripper_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    open_loop_control: true
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0
      gripper_joint: { trajectory: 0.02, goal: 0.01 }
